/* 1부 ① 이론 강의: 프롬프트 엔지니어링 10장 슬라이드 */
.lecture-wrap{margin:0 0 8px}
.lecture-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.lecture-toolbar .lecture-current{font:700 14px var(--sans);color:var(--green)}
.lecture-toolbar .lecture-hint{font:12px var(--sans);color:var(--muted)}
.lecture-progress{display:flex;gap:4px;margin-bottom:12px;align-items:center}
.lecture-progress button{height:7px;flex:1;min-width:8px;border:0;background:#DCE9E0;border-radius:8px;padding:0;transition:background .15s}
.lecture-progress button:hover{background:#87AB97}
.lecture-progress button[aria-current="step"]{background:var(--green)}
.lecture-progress button.visited:not([aria-current="step"]){background:#AFCABB}
.lecture-slide{--lecture-purple:#6C458A;--lecture-purple-light:#F4EFF9;position:relative;border:1px solid #CFDFD2;background:linear-gradient(155deg,#fff 0%,#fff 70%,#F5FAF5 100%);border-radius:9px;box-shadow:0 8px 25px #183B320D;aspect-ratio:16/9;min-height:560px;display:flex;flex-direction:column;gap:15px;padding:clamp(23px,3vw,38px);overflow:hidden}
.lecture-slide:before{content:'';position:absolute;top:0;right:0;width:155px;height:7px;background:var(--green);border-radius:0 0 0 8px}
.lecture-slide .lecture-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 12px var(--sans);color:var(--muted)}
.lecture-slide .lecture-label{letter-spacing:.09em}
.lecture-slide h3.lecture-title{color:var(--forest);font-size:clamp(25px,2.9vw,36px);letter-spacing:-.052em;line-height:1.27;margin:1px 0 0}
.lecture-slide .lecture-lead{font-size:clamp(16px,1.7vw,22px);color:#456353;font-weight:700;line-height:1.5;margin:0}
.lecture-slide .lecture-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.lecture-slide .lecture-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #DFEAE2;padding-top:10px;font:12px var(--sans);color:var(--muted);margin-top:auto}
.lecture-level{display:inline-flex;align-items:center;justify-content:center;border:1px solid #B5D1C0;border-radius:14px;padding:3px 11px;background:#EDF5EF;color:var(--green);font:700 12px var(--sans)}
.lecture-level.advanced{background:var(--lecture-purple-light);color:var(--lecture-purple);border-color:#D9C8E5}
.lecture-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.lecture-grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.lecture-panel{background:#F3F8F4;border:1px solid #D9E7DD;border-radius:7px;padding:15px 16px;min-width:0}
.lecture-panel.white{background:#fff}.lecture-panel.purple{background:var(--lecture-purple-light);border-color:#DFD2EA}
.lecture-panel h4{color:var(--forest);font-size:18px;line-height:1.33;margin:0 0 7px}
.lecture-panel p{font-size:15px;line-height:1.5;margin:0}
.lecture-panel .small{font-size:13px;line-height:1.48;color:#52695D}
.lecture-panel .purple-text{color:var(--lecture-purple)}
.lecture-panel .micro{font:700 12px var(--sans);letter-spacing:.02em;color:#6A8273;display:block;margin:0 0 6px}
.lecture-panel .big{font-size:24px;line-height:1.4;font-weight:700;color:var(--forest)}
.lecture-takeaway{background:#EAF3ED;border-left:4px solid var(--green);padding:12px 17px;font-size:16px;font-weight:700;color:var(--forest);border-radius:0 6px 6px 0}
.lecture-takeaway.purple{background:var(--lecture-purple-light);border-left-color:var(--lecture-purple)}
.lecture-steps{display:flex;gap:9px;align-items:stretch;justify-content:center}
.lecture-steps .lecture-panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
.lecture-arrow{font:700 24px var(--sans);color:#689281;align-self:center;flex:none}
.lecture-card-id{font:700 12px var(--sans);color:#5F7D69;display:block;margin-bottom:5px}
.lecture-table-wrap{width:100%;overflow-x:auto}
.lecture-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px;line-height:1.35}
.lecture-table thead th{background:var(--green);color:#fff;text-align:left;font-weight:700;padding:9px 10px}
.lecture-table td{padding:8px 10px;border-bottom:1px solid #D9E6DC;vertical-align:top}
.lecture-table tbody tr:nth-child(odd){background:#F3F8F4}
.lecture-table .focusrow{background:#EAF1EB!important;font-weight:700}
.lecture-table .focusrow td{border-top:2px solid var(--green);border-bottom:2px solid var(--green)}
.lecture-table.tight{font-size:13px}
.lecture-table.tight td,.lecture-table.tight th{padding:6px 9px}
.lecture-alert{color:var(--lecture-purple);font-weight:700}
.lecture-flag{display:inline-block;padding:2px 6px;background:var(--lecture-purple-light);border:1px dashed #AD8DC6;border-radius:3px;color:var(--lecture-purple);font-weight:700}
.lecture-bullets{margin:4px 0;padding-left:18px}.lecture-bullets li{margin:6px 0;font-size:15px;line-height:1.42}
.lecture-flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lecture-flow .node{padding:9px 12px;border:1px solid #D2E2D6;border-radius:5px;background:#EEF6EF;color:var(--forest);font:700 13px var(--sans)}
.lecture-flow .node.check{background:var(--lecture-purple-light);border-color:#D7C6E4;color:var(--lecture-purple)}
.lecture-flow .dir{font:700 18px var(--sans);color:#88A697}
.lecture-phase{font:700 13px var(--sans);color:#557A64;margin-bottom:4px}
.lecture-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 0 0}
.lecture-controls .btn{min-width:125px}
.lecture-controls .centre{font:700 13px var(--sans);color:var(--green);text-align:center}
.lecture-controls .btn:disabled{opacity:.38}
.lecture-note{margin:15px 0 0;border:1px solid var(--line);border-radius:5px;background:#F8FBF8;padding:11px 14px;font:13px/1.65 var(--sans);color:var(--muted)}
.lecture-note summary{cursor:pointer;font-weight:700;color:var(--green)}
.lecture-note p{margin:8px 0 0}
.lecture-cta{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#EDF5EF;padding:12px 15px;border-radius:6px}
.lecture-cta p{font:700 13px var(--sans);margin:0;color:var(--green)}
.lecture-cta .btn{white-space:nowrap}
.lecture-slide .fineprint{font:11px/1.4 var(--sans);color:var(--muted)}
.lecture-slide[data-slide-index="6"] .lecture-grid > .lecture-panel{padding:9px 12px}
.lecture-slide[data-slide-index="6"] .lecture-grid .small{line-height:1.3}
.lecture-slide[data-slide-index="8"] .lecture-grid > .lecture-panel{padding:9px 12px}
.lecture-slide[data-slide-index="8"] .lecture-grid .lecture-panel .lecture-panel{padding:8px 10px;margin:4px 0!important;font-size:14px;line-height:1.28}
.lecture-slide[data-slide-index="8"] .lecture-flow{margin:5px 0!important}
.lecture-slide[data-slide-index="8"] .lecture-bullets li{margin:4px 0}
@media(max-width:900px){.lecture-slide{min-height:535px;aspect-ratio:auto}.lecture-panel{padding:12px}.lecture-panel h4{font-size:16px}.lecture-panel p{font-size:14px}.lecture-grid{gap:9px}.lecture-table{font-size:13px}}
@media(max-width:680px){.lecture-slide{min-height:0;padding:20px 15px;gap:12px}.lecture-slide h3.lecture-title{font-size:25px}.lecture-slide .lecture-lead{font-size:16px}.lecture-grid,.lecture-grid.cols3{grid-template-columns:1fr}.lecture-grid.mobile2,.lecture-grid.cols3.mobile2{grid-template-columns:repeat(2,minmax(0,1fr))}.lecture-steps{flex-wrap:wrap}.lecture-steps .lecture-panel{flex:1 1 40%}.lecture-arrow{font-size:15px}.lecture-body{justify-content:flex-start!important}.lecture-table{font-size:12px}.lecture-table.tight{font-size:11px}.lecture-controls .btn{min-width:98px;padding:10px}.lecture-takeaway{font-size:14px}.lecture-panel .big{font-size:21px}.lecture-slide .lecture-footer{font-size:10px}}
@media(print){.sidebar,.top,.lecture-toolbar,.lecture-progress,.lecture-controls,.lecture-note,.desktop-footer{display:none!important}.layout{display:block;border:none}.main{padding:0}.lecture-slide{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}

</style>

 {level:'응용',time:'4:00–4:40',title:'체이닝 원리와 원자료',lead:'앞 단계에서 검토한 결과만 다음 단계의 입력으로 넘긴다.',html:`

 {level:'응용',time:'4:40–5:50',title:'STEP 1 정리 → STEP 2 계산·오류 검증',lead:'단계마다 목표 하나 · 다음으로 넘기기 전에 확인한다.',html:`
  <div class="lecture-grid">

  </div><div class="lecture-takeaway purple">음수를 0으로 바꾸거나 빈칸을 임의로 채우지 않음.</div><div class="fineprint">※ 교육용 합성 데이터</div>`,note:'STEP 1은 정리만 진행, 사람이 원자료와 5행을 대조함. STEP 2 계산은 케이블 28·공유기 13·어댑터 −5·배터리 계산 불가·스위치 10. 오류와 누락을 표시함.'},
 {level:'응용',time:'5:50–7:00',title:'STEP 3 검증 결과로 보고서 초안 작성',lead:'미확정 사항을 숨기지 않고, 사람 승인 전에는 초안으로 둔다.',html:`
  <div class="lecture-grid"><div class="lecture-panel"><span class="lecture-phase">프롬프트 핵심 지시</span><ul class="lecture-bullets"><li><b>STEP 2 검토 결과만</b> 사용</li><li>재고 현황 / 확인 필요 / 후속 조치로 구분</li><li>어댑터 음수·배터리 누락 숨기지 않기</li><li>확인 전 전체 재고 합계 확정 금지</li><li>근거 없는 원인·조치 완료 사실 생성 금지</li></ul></div>

  <div class="lecture-takeaway purple">AI 초안 → 사람 검토·승인 · 확인되지 않은 전체 합계는 확정하지 않음.</div><div class="fineprint">※ 교육용 재구성 · 실제 기관 제출 전 추가 검증 필요</div>`,note:'한 번에 재고 분석과 보고서 작성을 요청하면 어디서 오류가 생겼는지 확인하기 어려움. 검증한 결과만 넘기면 보고서 단계에서 미확정 항목을 유지할 수 있음.'},
 {level:'심화',time:'7:00–8:00',title:'오류가 발견되면 어디로 돌아가는가',lead:'오류 처리의 핵심은 탐지·분기·복귀·승인이다.',html:`

  <div class="lecture-panel"><h4>오류 처리 4원칙</h4><ul class="lecture-bullets"><li><b>탐지</b> · 무엇이 기준과 다른가?</li><li><b>분기</b> · 중단 또는 사람 확인?</li><li><b>복귀</b> · 어디부터 다시 실행?</li><li><b>승인</b> · 재검증 완료를 누가 확인?</li></ul></div></div>
  <div class="lecture-takeaway purple">수정되지 않은 값을 다음 단계로 넘기면 오류가 연쇄 전파됨.</div>`,note:'원자료를 수정했다면 이전 STEP 1 결과가 낡은 값이므로 STEP 1부터 재실행함. 계산식·분류 규칙만 수정했다면 STEP 2부터 시작할 수 있음.'},
 {level:'심화',time:'8:00–9:00',title:'프롬프트 밖에서 함께 작동하는 기술',lead:'프롬프트(지시)와 시스템 기능은 서로 다른 역할을 맡는다.',html:`

 {level:'심화',time:'9:00–10:00',title:'실행 전 6가지 확인 · 핵심 정리',lead:'좋은 프롬프트 = 잘 쓰는 지시 + 실패했을 때 멈추는 규칙.',html:`

function moveTheorySlide(next){
 const old=Math.max(0,Math.min(lectureSlides.length-1,Number(data.theorySlide)||0));
 const target=Math.max(0,Math.min(lectureSlides.length-1,old+next));
 if(target===old)return;
 data.theorySlide=target;render();
 document.getElementById('lectureSlide')?.scrollIntoView({behavior:'instant',block:'nearest'});
}
function pageTheory(){
 const n=Math.max(0,Math.min(lectureSlides.length-1,Number(data.theorySlide)||0));
 const s=lectureSlides[n];
 return shell('01','이론 강의','프롬프트 엔지니어링 · 기본 → 응용 → 심화 · 10분 핵심 강의 (10장)',`
 <section class="lecture-wrap" aria-label="프롬프트 엔지니어링 강의 슬라이드">
  <div class="lecture-toolbar"><span class="lecture-current">SLIDE ${String(n+1).padStart(2,'0')} / ${lectureSlides.length}</span><span class="lecture-hint">이전·다음 버튼 또는 키보드 ← →</span></div>
  <nav class="lecture-progress" aria-label="슬라이드 바로가기">${lectureSlides.map((x,i)=>`<button type="button" data-lecture-index="${i}" class="${i<n?'visited':''}" ${i===n?'aria-current="step"':''} aria-label="${i+1}번 슬라이드: ${x.title}" title="${i+1}. ${x.title}"></button>`).join('')}</nav>
  <article id="lectureSlide" class="lecture-slide" data-slide-index="${n+1}" aria-live="polite" aria-label="슬라이드 ${n+1} / ${lectureSlides.length}">
   <div class="lecture-heading"><span class="lecture-label">PROMPT ENGINEERING · ${s.time}</span><span>사회복지업무와 AI 활용 · 이론</span></div>
   <h3 class="lecture-title">${s.title}</h3><p class="lecture-lead">${s.lead}</p>
   <div class="lecture-body">${s.html}</div>
   <div class="lecture-footer"><span>자료: 프롬프트 엔지니어링 10분 강의 · 2026.11.10</span><span class="lecture-level ${s.level==='심화'?'advanced':''}">${s.level}</span></div>
  </article>
  <div class="lecture-controls"><button type="button" class="btn secondary" id="prevSlide" ${n===0?'disabled':''}>← 이전</button><span class="centre">${n+1} / ${lectureSlides.length}장</span><button type="button" class="btn" id="nextSlide" ${n===lectureSlides.length-1?'disabled':''}>다음 →</button></div>
  <details class="lecture-note"><summary>강사용 발표 메모 (${s.time})</summary><p>${s.note}</p></details>
 </section>`,'AI가 만든 결과는 사람의 검증과 승인으로 완성됩니다.',false);
}
function pageQuiz(){const n=Math.max(0,Math.min(quizQuestions.length-1,Number(data.quizCurrent)||0));const q=quizQuestions[n];let answered=data.quizAnswers[n],has=answered!==undefined;return shell('02','프롬프트 퀴즈','이론 → 사례 → 단계별 구조화. 아래 6문항은 기능 확인용 임시 예제이며 정식 문제팩이 아님.',`<div class="card soft"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="mini-tag">${q.group} 퀴즈</span><span class="quiz-progress">${n+1} / ${quizQuestions.length} 문항</span></div><div class="progress-track"><div style="width:${(n+1)*100/quizQuestions.length}%"></div></div><h3 style="font-size:19px">${q.q}</h3><div>${q.choices.map((c,i)=>`<button data-answer="${i}" class="quiz-choice ${has&&i===q.a?'correct':''} ${has&&i===answered&&i!==q.a?'wrong':''}" ${has?'disabled':''}><b>${['①','②','③'][i]}</b>　${c}</button>`).join('')}</div>${has?`<div class="quiz-feedback ${answered===q.a?'':'bad'}"><b>${answered===q.a?'정답':'다시 확인해 보세요'}</b><br>${q.exp}</div>`:''}<div class="actions"><button class="btn secondary" data-quizgo="prev" ${n===0?'disabled':''}>← 이전 문항</button><button class="btn" data-quizgo="next" ${n===quizQuestions.length-1?'disabled':''}>다음 문항 →</button><button class="btn ghost" id="clearQuiz">퀴즈 초기화</button></div></div><div class="card blue"><h3>퀴즈 운영 규칙</h3><p>정답만 맞히는 것보다 <b>어떤 정보가 빠졌는지</b> 발견하는 것이 목표입니다. 정식 사회복지업무 문제팩은 사용자가 제공한 사례 확정 후 교체합니다.</p></div>`,'정답을 기억하기보다 누락된 자료·서식·검증 기준을 찾아냅니다.')}
function makePrompt(fields){return labels.filter(([k])=>String(fields[k]||'').trim()).map(([k,label])=>`[${label.split(' · ')[0]}]\n${String(fields[k]).trim()}`).join('\n\n')}

function parseSections(txt){const res={};if(!txt)return res;const sections=[...txt.matchAll(/^\s*\[(목적|역할|맥락|입력자료|지시|출력형식|제약|검증)\]\s*$/gm)];sections.forEach((m,i)=>{const start=m.index+m[0].length,end=i+1<sections.length?sections[i+1].index:txt.length;res[m[1]]=txt.slice(start,end).trim()});return res}
function structScore(txt){const parsed=parseSections(txt);const out=keyword.map(([k,max])=>({name:k,max,earned:parsed[k]&&parsed[k].replace(/\s/g,'').length>=5?max:0}));return {rows:out,total:out.reduce((s,x)=>s+x.earned,0),parsed}}

function pageSetup(){const checks=['새 프로젝트 만들기 — 우리 기관 홍보 도우미','강사가 제공한 프로젝트 지침 붙여넣기','가상 기관 소개·프로그램 안내자료 추가하기','프로젝트 안에서 새 채팅 시작하기'];return shell('09','프로젝트 설정','강사 제공 지침과 가상 자료를 프로젝트에 등록하는 학습 경로입니다.',`<div class="card soft"><h3>ChatGPT 프로젝트 4단계</h3>${checks.map((x,i)=>`<label class="checkrow"><input type="checkbox" data-setupcheck="${i}" ${data.setupChecks[i]?'checked':''}><span><b>${String(i+1).padStart(2,'0')}</b> · ${x}</span></label>`).join('')}</div><div class="card blue"><h3>등록 안내</h3><p>현재는 강사 프로젝트 지침 원문이 제공되지 않았으므로 완성본을 임의로 작성하지 않음. 프로젝트 사용 메뉴는 ChatGPT 실제 계정·버전에 따라 달라질 수 있음.</p></div><div class="actions"><button class="btn" id="goPoster">다음: 포스터 제작 →</button></div>`,'프로젝트에 저장된 맥락을 반복 활용하더라도 사실 검증은 매번 필요합니다.')}

function pagePoster(){return shell('10','홍보 포스터 만들기','모두봄복지관(가상)의 스마트폰 사진교실 안내를 활용합니다.',`<div class="grid2"><div class="card soft"><h3>교육용 프로그램 원자료</h3><p>기관: 모두봄복지관(가상)<br>사업: 나도 사진 작가! 스마트폰 사진교실<br>대상: 지역 60세 이상 주민 12명<br>기간: 2026.11.19~12.10, 매주 목요일 14:00~15:30 (4회)<br>장소: 가상 복지관 2층 배움실<br>접수: 11.12~18, 안내데스크 방문 접수<br>참가비: 무료(가상)<br>문의: 프로그램팀(전화번호 미제공)</p><p class="help">전화번호·주소·혜택·후원기관은 원자료에 없으므로 만들지 않음.</p></div><div class="card"><h3>미리보기용 포스터 목업</h3><div class="poster"><small>모두봄복지관(가상)</small><strong>나도 사진 작가!<br>스마트폰 사진교실</strong><div class="camera" aria-hidden="true">▣</div><div class="info">대상 · 60세 이상 주민 12명<br>일정 · 11.19~12.10 매주 목요일<br>시간 · 14:00~15:30<br>접수 · 11.12~18 방문 접수</div></div><p class="help" style="text-align:center">위 이미지는 HTML 시연용 정적 목업이며 AI 생성 결과가 아님.</p></div></div><div class="card"><h3>포스터 생성 요청문</h3><div class="readout">${formatText(posterPrompt)}</div><div class="actions"><button class="btn secondary" id="copyPoster">요청문 복사</button><button class="btn" id="goPosterReview">포스터 검증 →</button></div></div>`,'프로그램의 확정 안내자료에 없는 연락처·일정·혜택을 생성하지 않습니다.')}
function pagePosterReview(){const checks=['사업명·대상·일정·접수 정보가 원자료와 일치하는가?','연락처·혜택·후원기관 등 미제공 정보를 만들지 않았는가?','한글 오탈자·글자 크기·대비·가독성을 확인했는가?','초상권·저작권·개인정보 문제가 없는가?','실제 게시 전 담당자·기관장의 승인이 필요함을 이해했는가?'];return shell('11','포스터 검증·저장','AI 포스터는 검토용 초안입니다. 실제 기관 게시 전에는 별도 승인이 필요합니다.',`<div class="card blue"><h3>포스터 확인 체크리스트</h3>${checks.map((c,i)=>`<label class="checkrow"><input type="checkbox" data-postercheck="${i}" ${data.posterChecks[i]?'checked':''}><span>${c}</span></label>`).join('')}</div><div class="card"><h3>수정·확인 메모</h3>${inputArea('posterMemo','포스터에서 수정할 점 또는 확인한 사항','예: 날짜·장소 확인, 전화번호 삭제, 제목 크기 확대',5)}<div class="actions"><button class="btn secondary" id="downloadPosterReview">포스터 점검 메모 TXT</button><button class="btn ghost" id="backupPoster">전체 활동 JSON 백업</button></div></div>`,'AI 이미지 생성 → 오류 확인 → 수정 → 기관 최종 승인(교육 시간 중 외부 게시 없음)')}
const renderers={theory:pageTheory,quiz:pageQuiz,builder:pageBuilder,practice1:pageP1,practice2:pageP2,practice3:pageP3,wrap:pageWrap,projectIntro:pageProjectIntro,projectSetup:pageSetup,poster:pagePoster,posterReview:pagePosterReview};
function render(){nav();document.getElementById('content').innerHTML=renderers[data.active]?.()||pageTheory();persist();}
function navigate(id){if(!renderers[id])return;data.active=id;if(part1ids.includes(id))data.expanded.first=true;else data.expanded.second=true;render();window.scrollTo({top:0,behavior:'instant'});closeMobile();}
function closeMobile(){document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('overlay').classList.remove('visible');document.getElementById('mobileMenu').setAttribute('aria-expanded','false')}
function exampleBuilder(){Object.assign(data.builder,{goal:'어르신 디지털 생활교육 사업계획서의 검토용 초안을 작성한다.',role:'사회복지기관 문서 작성 보조자',context:'가온복지관(가상), 2026년 9월 신규 프로그램 기획 단계',materials:'대상 65세 이상 20명, 주1회 총4회, 회당 90분, 예산 1,200,000원',task:'사업 목적·세부 운영·예산·확인 필요 사항을 정리한다.',format:'7개 목차와 예산 항목 표',limits:'정해지지 않은 장소·강사·실적·예산 승인 여부를 지어내지 않는다.',verify:'원자료와 수치 대조, 미확정 항목 [확인 필요] 표시'});data.promptOriginal=makePrompt(data.builder);data.improveRequest=buildImprovementRequest(data.promptOriginal);data.comparison=false;render();toast('교육용 가상 예시를 입력함')}
function doCompare(){if(!data.promptImproved.trim()){toast('먼저 ChatGPT 개선본을 붙여넣으세요');return}data.comparison=true;render();toast('구조 표시를 비교함 — 내용 품질 평가는 별도입니다')}
function doBackup(){const payload={schemaVersion:1,exportedAt:new Date().toISOString(),title:'261111 사회복지 AI 수업 HTML 시안',data};download('261111_사회복지AI_실습기록.json',JSON.stringify(payload,null,2),'application/json');toast('활동 기록 JSON 파일 저장')}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.builder){data.builder[t.dataset.builder]=t.value;persist()}else if(t.dataset.bind){data[t.dataset.bind]=t.value;persist()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.check!==undefined){data.checks[Number(t.dataset.check)]=t.checked;persist()}if(t.dataset.setupcheck!==undefined){data.setupChecks[Number(t.dataset.setupcheck)]=t.checked;persist()}if(t.dataset.postercheck!==undefined){data.posterChecks[Number(t.dataset.postercheck)]=t.checked;persist()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const id=el.id, navId=el.dataset.nav,toggle=el.dataset.toggle;
 if(navId){navigate(navId);return}if(toggle){data.expanded[toggle]=!data.expanded[toggle];nav();persist();return}
 if(el.dataset.lectureIndex!==undefined){data.theorySlide=Math.max(0,Math.min(lectureSlides.length-1,Number(el.dataset.lectureIndex)||0));render();return}
 if(id==='prevSlide'||id==='nextSlide'){moveTheorySlide(id==='nextSlide'?1:-1);return}
 if(id==='goTheoryQuiz'){navigate('quiz');return}
 if(el.dataset.answer!==undefined){const n=data.quizCurrent;if(data.quizAnswers[n]===undefined){data.quizAnswers[n]=Number(el.dataset.answer);render()}return}
 if(el.dataset.quizgo){data.quizCurrent=Math.max(0,Math.min(quizQuestions.length-1,data.quizCurrent+(el.dataset.quizgo==='next'?1:-1)));render();return}
 if(el.dataset.doc){data.selectedDoc=el.dataset.doc;render();return}
 switch(id){case 'mobileMenu':{const o=document.getElementById('sidebar');const open=!o.classList.contains('mobile-open');o.classList.toggle('mobile-open',open);document.getElementById('overlay').classList.toggle('visible',open);el.setAttribute('aria-expanded',String(open));break}
 case 'prevPage':case 'nextPage':{const idx=ids.indexOf(data.active)+(id==='nextPage'?1:-1);navigate(ids[Math.max(0,Math.min(ids.length-1,idx))]);break}
 case 'generateBuilder':{data.promptOriginal=makePrompt(data.builder);data.improveRequest=buildImprovementRequest(data.promptOriginal);data.comparison=false;render();toast('원본 프롬프트 블록 생성');break}
 case 'builderFillDemo':exampleBuilder();break;case 'copyOriginal':copyText(data.promptOriginal||makePrompt(data.builder));break;
 case 'copyImprove':{const prompt=data.promptOriginal||makePrompt(data.builder);copyText(buildImprovementRequest(prompt));break}
 case 'comparePrompts':doCompare();break;case 'moveFinal':{const val=String(data.finalPrompt||'').trim();if(!val){toast('먼저 최종 수정본을 입력해 주세요');break}navigate('practice2');toast('최종 프롬프트를 실습 ②로 연결함');break}
 case 'copyFinal':copyText(data.finalPrompt);break;case 'copySource':copyText(demo[data.selectedDoc].source);break;
 case 'goP2':navigate('practice2');break;case 'copyPracticePrompt':copyText(data.finalPrompt||data.promptOriginal||getDefaultRequest());break;
 case 'useDefaultPrompt':{copyText(getDefaultRequest());toast('기본 프롬프트 복사함 (작성한 최종본 유지)');break}
 case 'openChatGPT':window.open('https://chatgpt.com/','_blank','noopener,noreferrer');break;case 'goP3':navigate('practice3');break;
 case 'downloadDoc':{if(!String(data.humanRevised||'').trim()){toast('수정 문서를 입력한 후 저장해 주세요');break}download('261111_수정문서_교육용.txt','[교육용 가상자료]\n'+data.humanRevised);toast('수정 문서 TXT 저장');break}
 case 'downloadPrompt':{const txt=data.finalPrompt||data.promptOriginal||getDefaultRequest();download('261111_프롬프트_교육용.txt',txt);toast('프롬프트 TXT 저장');break}
 case 'goPoster':navigate('poster');break;case 'copyPoster':copyText(posterPrompt);break;case 'goPosterReview':navigate('posterReview');break;
 case 'downloadPosterReview':download('261111_포스터_검증메모.txt','[교육용 가상자료]\n'+data.posterMemo+'\n\n확인 상태: '+data.posterChecks.filter(Boolean).length+'/5');toast('메모 저장');break;
 case 'clearQuiz':if(confirm('현재 퀴즈 답변을 초기화할까요?')){data.quizAnswers={};data.quizCurrent=0;render()}break;
 case 'downloadBackup':case 'backupHere':case 'backupPoster':doBackup();break;
 case 'restoreBackup':document.getElementById('restoreFile').click();break;
 case 'backBuilder':navigate('builder');break;
 case 'resetAll':if(confirm('이 브라우저의 모든 실습 입력과 선택 결과를 지울까요? JSON 백업 후 초기화를 권장합니다.')){data=defaults();render();toast('입력을 초기화함')}break;
 }
});
document.addEventListener('keydown',e=>{
 if(data.active!=='theory'||e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();moveTheorySlide(e.key==='ArrowRight'?1:-1)}
});
document.getElementById('overlay').addEventListener('click',closeMobile);
document.getElementById('restoreFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2_000_000)throw Error('JSON 파일 용량이 너무 큼');const obj=JSON.parse(await file.text());if(obj.schemaVersion!==1||!obj.data||typeof obj.data!=='object'||!obj.data.builder||!obj.data.selectedDoc)throw Error('이 실습안의 백업 파일이 아님');const d=defaults();data={...d,...obj.data,builder:{...d.builder,...obj.data.builder},expanded:{...d.expanded,...obj.data.expanded},checks:Array.isArray(obj.data.checks)?obj.data.checks.slice(0,5):d.checks};if(!renderers[data.active])data.active='builder';if(!demo[data.selectedDoc])data.selectedDoc='plan';render();toast('활동 기록을 복원함')}catch(err){toast('복원 실패: '+err.message)}e.target.value=''});
render();
</script>
</body>
