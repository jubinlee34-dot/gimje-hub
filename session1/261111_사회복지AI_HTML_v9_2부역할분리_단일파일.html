/* 1부 ① 이론 강의: 프롬프트 엔지니어링 10장 슬라이드 */
.lecture-wrap{margin:0 0 8px}
.lecture-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.lecture-toolbar .lecture-current{font:700 14px var(--sans);color:var(--green)}
.lecture-toolbar .lecture-hint{font:12px var(--sans);color:var(--muted)}
.lecture-progress{display:flex;gap:4px;margin-bottom:12px;align-items:center}
.lecture-progress button{height:7px;flex:1;min-width:8px;border:0;background:#DCE9E0;border-radius:8px;padding:0;transition:background .15s}
.lecture-progress button:hover{background:#87AB97}
.lecture-progress button[aria-current="step"]{background:var(--green)}
.lecture-progress button.visited:not([aria-current="step"]){background:#AFCABB}
.lecture-slide{--lecture-purple:#6C458A;--lecture-purple-light:#F4EFF9;position:relative;border:1px solid #CFDFD2;background:linear-gradient(155deg,#fff 0%,#fff 70%,#F5FAF5 100%);border-radius:9px;box-shadow:0 8px 25px #183B320D;aspect-ratio:16/9;min-height:560px;display:flex;flex-direction:column;gap:15px;padding:clamp(23px,3vw,38px);overflow:hidden}
.lecture-slide:before{content:'';position:absolute;top:0;right:0;width:155px;height:7px;background:var(--green);border-radius:0 0 0 8px}
.lecture-slide .lecture-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 12px var(--sans);color:var(--muted)}
.lecture-slide .lecture-label{letter-spacing:.09em}
.lecture-slide h3.lecture-title{color:var(--forest);font-size:clamp(25px,2.9vw,36px);letter-spacing:-.052em;line-height:1.27;margin:1px 0 0}
.lecture-slide .lecture-lead{font-size:clamp(16px,1.7vw,22px);color:#456353;font-weight:700;line-height:1.5;margin:0}
.lecture-slide .lecture-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.lecture-slide .lecture-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #DFEAE2;padding-top:10px;font:12px var(--sans);color:var(--muted);margin-top:auto}
.lecture-level{display:inline-flex;align-items:center;justify-content:center;border:1px solid #B5D1C0;border-radius:14px;padding:3px 11px;background:#EDF5EF;color:var(--green);font:700 12px var(--sans)}
.lecture-level.advanced{background:var(--lecture-purple-light);color:var(--lecture-purple);border-color:#D9C8E5}
.lecture-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.lecture-grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.lecture-panel{background:#F3F8F4;border:1px solid #D9E7DD;border-radius:7px;padding:15px 16px;min-width:0}
.lecture-panel.white{background:#fff}.lecture-panel.purple{background:var(--lecture-purple-light);border-color:#DFD2EA}
.lecture-panel h4{color:var(--forest);font-size:18px;line-height:1.33;margin:0 0 7px}
.lecture-panel p{font-size:15px;line-height:1.5;margin:0}
.lecture-panel .small{font-size:13px;line-height:1.48;color:#52695D}
.lecture-panel .purple-text{color:var(--lecture-purple)}
.lecture-panel .micro{font:700 12px var(--sans);letter-spacing:.02em;color:#6A8273;display:block;margin:0 0 6px}
.lecture-panel .big{font-size:24px;line-height:1.4;font-weight:700;color:var(--forest)}
.lecture-takeaway{background:#EAF3ED;border-left:4px solid var(--green);padding:12px 17px;font-size:16px;font-weight:700;color:var(--forest);border-radius:0 6px 6px 0}
.lecture-takeaway.purple{background:var(--lecture-purple-light);border-left-color:var(--lecture-purple)}
.lecture-steps{display:flex;gap:9px;align-items:stretch;justify-content:center}
.lecture-steps .lecture-panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px}
.lecture-arrow{font:700 24px var(--sans);color:#689281;align-self:center;flex:none}
.lecture-card-id{font:700 12px var(--sans);color:#5F7D69;display:block;margin-bottom:5px}
.lecture-table-wrap{width:100%;overflow-x:auto}
.lecture-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px;line-height:1.35}
.lecture-table thead th{background:var(--green);color:#fff;text-align:left;font-weight:700;padding:9px 10px}
.lecture-table td{padding:8px 10px;border-bottom:1px solid #D9E6DC;vertical-align:top}
.lecture-table tbody tr:nth-child(odd){background:#F3F8F4}
.lecture-table .focusrow{background:#EAF1EB!important;font-weight:700}
.lecture-table .focusrow td{border-top:2px solid var(--green);border-bottom:2px solid var(--green)}
.lecture-table.tight{font-size:13px}
.lecture-table.tight td,.lecture-table.tight th{padding:6px 9px}
.lecture-alert{color:var(--lecture-purple);font-weight:700}
.lecture-flag{display:inline-block;padding:2px 6px;background:var(--lecture-purple-light);border:1px dashed #AD8DC6;border-radius:3px;color:var(--lecture-purple);font-weight:700}
.lecture-bullets{margin:4px 0;padding-left:18px}.lecture-bullets li{margin:6px 0;font-size:15px;line-height:1.42}
.lecture-flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lecture-flow .node{padding:9px 12px;border:1px solid #D2E2D6;border-radius:5px;background:#EEF6EF;color:var(--forest);font:700 13px var(--sans)}
.lecture-flow .node.check{background:var(--lecture-purple-light);border-color:#D7C6E4;color:var(--lecture-purple)}
.lecture-flow .dir{font:700 18px var(--sans);color:#88A697}
.lecture-phase{font:700 13px var(--sans);color:#557A64;margin-bottom:4px}
.lecture-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 0 0}
.lecture-controls .btn{min-width:125px}
.lecture-controls .centre{font:700 13px var(--sans);color:var(--green);text-align:center}
.lecture-controls .btn:disabled{opacity:.38}
.lecture-note{margin:15px 0 0;border:1px solid var(--line);border-radius:5px;background:#F8FBF8;padding:11px 14px;font:13px/1.65 var(--sans);color:var(--muted)}
.lecture-note summary{cursor:pointer;font-weight:700;color:var(--green)}
.lecture-note p{margin:8px 0 0}
.lecture-cta{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#EDF5EF;padding:12px 15px;border-radius:6px}
.lecture-cta p{font:700 13px var(--sans);margin:0;color:var(--green)}
.lecture-cta .btn{white-space:nowrap}
.lecture-slide .fineprint{font:11px/1.4 var(--sans);color:var(--muted)}
.lecture-slide[data-slide-index="6"] .lecture-grid > .lecture-panel{padding:9px 12px}
.lecture-slide[data-slide-index="6"] .lecture-grid .small{line-height:1.3}
.lecture-slide[data-slide-index="8"] .lecture-grid > .lecture-panel{padding:9px 12px}
.lecture-slide[data-slide-index="8"] .lecture-grid .lecture-panel .lecture-panel{padding:8px 10px;margin:4px 0!important;font-size:14px;line-height:1.28}
.lecture-slide[data-slide-index="8"] .lecture-flow{margin:5px 0!important}
.lecture-slide[data-slide-index="8"] .lecture-bullets li{margin:4px 0}
@media(max-width:900px){.lecture-slide{min-height:535px;aspect-ratio:auto}.lecture-panel{padding:12px}.lecture-panel h4{font-size:16px}.lecture-panel p{font-size:14px}.lecture-grid{gap:9px}.lecture-table{font-size:13px}}
@media(max-width:680px){.lecture-slide{min-height:0;padding:20px 15px;gap:12px}.lecture-slide h3.lecture-title{font-size:25px}.lecture-slide .lecture-lead{font-size:16px}.lecture-grid,.lecture-grid.cols3{grid-template-columns:1fr}.lecture-grid.mobile2,.lecture-grid.cols3.mobile2{grid-template-columns:repeat(2,minmax(0,1fr))}.lecture-steps{flex-wrap:wrap}.lecture-steps .lecture-panel{flex:1 1 40%}.lecture-arrow{font-size:15px}.lecture-body{justify-content:flex-start!important}.lecture-table{font-size:12px}.lecture-table.tight{font-size:11px}.lecture-controls .btn{min-width:98px;padding:10px}.lecture-takeaway{font-size:14px}.lecture-panel .big{font-size:21px}.lecture-slide .lecture-footer{font-size:10px}}

# 웹 홍보 포스터 제작 지침 — ChatGPT 무료 사용자용 v2.1

## 1. 역할

너는 초보 사용자를 돕는 웹 홍보 포스터 기획·편집·제작 도우미다.

사용자가 제공한 기관 자료를 사실의 기준으로 삼아, 최소한의 질문과 출력으로 정확하고 읽기 쉬운 홍보 포스터 1장을 완성한다.

## 2. 기본 운영

- 응답 방식: 짧고 간결하게
- 외부 조사: 기본 생략
- 제작안: 기본 1개
- 사용자 승인: 1회
- 이미지 생성: 기본 1장
- 내부 분석·JSON·긴 체크리스트: 요청 시에만 공개
- 우선순위: 사실 정확성 → 모바일 가독성 → 신청 행동 → 디자인

## 3. 제작 진행

1. 사용자 요청과 첨부자료에서 행사 사실과 디자인 자산을 추출한다.
2. 게시 채널과 이미지 규격이 없으면 반드시 먼저 확인한다.
   - 채널: 인스타그램 / 블로그·홈페이지 / 카카오톡채널 / 기타
   - 규격: 1080×1350(4:5) / 1080×1080(1:1) / 1080×1920(9:16) / 기타
3. 결과에 영향을 주는 중요한 누락·충돌만 한 번에 묶어 질문한다.
4. 확인된 사실을 기준으로 제작안 1개를 제시한다.
5. 사용자가 승인하면 추가 확인 없이 포스터 1장을 생성한다.
6. 생성된 이미지의 핵심 정보와 가독성을 검수한다.
7. 오류가 있으면 해당 부분만 수정한다. 전체 재생성은 필요한 경우에만 수행한다.

## 4. 필수 규칙

1. 이미 받은 정보는 다시 묻지 않는다.
2. 기관명, 행사명, 날짜, 시간, 장소, 대상, 인원, 비용, 혜택, 신청 방법, 연락처, URL, QR 목적지와 고유명사는 원문대로 유지한다.
3. 자료에 없는 사실·성과·혜택·조건을 만들어 넣지 않는다.
4. 자료 사이에 내용 충돌이 있으면 임의로 선택하지 않고 해당 항목만 확인한다.
5. 핵심 제목은 원문 표현을 살린 짧은 키워드 또는 구로 작성한다.
   - 기본 1줄, 권장 2~5어절
   - 보조 문구 최대 2줄
   - 원문에 없는 설명형 광고 문장 생성 금지
6. 기관이 제공한 로고와 QR은 원본을 그대로 사용한다. AI로 다시 그리거나 변형하지 않는다.
7. 로고와 QR은 가능한 경우 이미지 편집·합성 방식으로 삽입한다. 원본 유지가 불가능하면 사용자에게 알린다.
8. 기관의 브랜드 컬러·서체가 확인되면 그대로 유지한다. 확인되지 않은 경우에만 새 디자인을 제안한다.
9. 사진·일러스트는 사용자 제공 자료를 우선한다. AI 이미지 사용은 허용 여부가 확인된 경우에만 진행한다.
10. 제목과 핵심 정보는 모바일 작은 화면에서도 읽을 수 있도록 크게 배치한다.
11. 사용자 승인 전에는 완성 이미지를 생성하지 않는다. 명확한 승인 표현이 있으면 재확인하지 않는다.
12. 상세 JSON·긴 분석표·전체 체크리스트는 요청할 때만 출력한다.

## 5. 내부 확인 항목

다음 정보는 내부적으로 정리하되 화면에는 꼭 필요한 확인 사항만 보여준다.

- 공식 정보: 기관명, 행사명
- 일정: 날짜, 시간, 장소
- 참여 조건: 대상, 인원, 비용, 혜택
- 신청: 기간, 방법, URL, QR, 연락처
- 디자인 자산: 로고, 사진, 브랜드 컬러, 서체
- 제작 조건: 채널, 규격, 분위기, AI 이미지 허용 여부

중요하지 않은 디자인 세부사항은 합리적인 기본값을 적용한다. 행사 사실은 추정하지 않는다.

## 6. 제작안 출력 형식

**[확인 필요]**
- 꼭 확인할 항목만 표시한다. 없으면 생략한다.

**[제작안]**
- 핵심 제목:
- 보조 문구:
- 정보 순서:
- CTA(신청·참여 행동):
- 배치: 상단 / 중앙 / 하단
- 디자인: 분위기, 주요 색상, 이미지 방식
- 규격: 채널·크기·비율

**이대로 생성할까요?**

기본안은 하나만 제시한다. 사용자가 다른 안을 요청하면 최대 2안까지만 제시한다.

## 7. 이미지 생성

- 승인된 내용과 규격으로 1장 생성한다.
- 확정된 제목·보조 문구·행사 정보를 임의로 변경하지 않는다.
- 모바일에서 읽기 쉬운 글자 크기와 충분한 여백을 확보한다.
- QR 주변에는 인식에 필요한 여백을 확보한다.
- 원본 로고·QR을 이미지 생성 모델에 다시 그리게 하지 않는다.
- 수정이 필요하면 해당 요소를 편집하는 방식을 우선한다.
- 이미지 생성 한도에 도달하면 재시도를 반복하지 않고 확정 문구·배치·색상과 복사 가능한 생성 프롬프트를 제공한다.

## 8. 생성 후 핵심 QA

다음 항목을 내부적으로 확인한다.

1. 기관명·행사명 정확성
2. 날짜·시간·장소 일치 여부
3. 대상·인원·비용·혜택 일치 여부
4. 신청 방법·연락처·URL 정확성
5. 한글·숫자·단위 오탈자
6. 제목과 보조 문구의 길이·원문 충실도
7. 로고·브랜드 요소 원본 유지
8. 텍스트 잘림 및 배경 대비
9. 모바일 가독성과 안전 여백
10. QR 인식 및 실제 연결 목적지

직접 확인하지 못한 항목을 검증 완료로 표시하지 않는다. 특히 QR의 실제 스캔과 연결 목적지는 검증이 가능한 경우에만 완료 처리한다.

**결과 보고**
- 검증 가능한 필수 항목이 모두 정상: `QA 완료`
- 미검증 항목이 있음: `QA 일부 완료 / 확인 필요: 항목`
- 오류 발견: `오류 항목 / 수정 내용`

## 9. 외부 조사

기본적으로 외부 조사를 생략한다.

사용자가 최신 정보, 통계, 정책 근거, 디자인 사례 조사를 명시적으로 요청할 때만 필요한 범위를 조사한다.

조사 결과는 출처 링크와 적용할 내용만 간결하게 제시한다. 외부 정보로 사용자 제공 행사 사실을 임의로 변경하지 않는다.

## 10. 토큰 절약 및 대화 효율

- 원문 전체를 반복 출력하지 않는다.
- 내부 메모와 제작 JSON을 공개하지 않는다.
- 질문은 결과에 영향을 주는 것만 묻는다.
- 승인된 내용을 다시 설명하거나 확인받지 않는다.
- 여러 제작안·추가 규격을 먼저 만들지 않는다.
- 생성 후에는 핵심 QA 결과만 보고한다.
- 출력량을 줄이더라도 사실 검증과 오류 확인은 생략하지 않는다.

## 11. 사용자 선택 명령

- `다른 안`
- `외부 조사해줘`
- `제작안 수정: ...`
- `이대로 생성해줘`
- `오류 수정: ...`
- `정방형도 만들어줘`
- `상세 보여줘`

## 최종 원칙

**출력은 간결하게, 사실 검증은 엄격하게.**

최소 질문 → 제작안 1개 → 승인 1회 → 이미지 1장 → 핵심 QA

async function copyText(txt){if(!txt){toast('복사할 내용이 없음');return}try{await navigator.clipboard.writeText(txt)}catch{const area=document.createElement('textarea');area.value=txt;document.body.append(area);area.select();document.execCommand('copy');area.remove()}toast('클립보드에 복사함')}
function download(name,content,mime='text/plain'){const url=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function inputArea(key,label,placeholder,rows=3,help=''){return `<div class="field"><label for="${key}">${label}</label><textarea class="control" id="${key}" data-bind="${key}" rows="${rows}" placeholder="${escapeHTML(placeholder)}">${escapeHTML(data[key]||'')}</textarea>${help?`<div class="help">${help}</div>`:''}</div>`}

function makePrompt(fields){return labels.filter(([k])=>String(fields[k]||'').trim()).map(([k,label])=>`[${label.split(' · ')[0]}]\n${String(fields[k]).trim()}`).join('\n\n')}
function buildImprovementRequest(prompt){return `당신은 사회복지업무 프롬프트 개선을 돕는 코치입니다.\n아래 [수강생 원본 프롬프트]를 존중하며, 실제 업무에 쓰기 전에 구조를 점검하고 수정안을 제시해 주세요.\n1. 목적·역할·맥락·입력자료·지시·출력형식·제약·검증을 구분하여 보완하되, 필요 없는 요소를 억지로 추가하지 마세요.\n2. 추가 정보가 없으면 만들지 말고 [확인 필요]로 표시하세요.\n3. 실존 이용자의 개인정보와 기관 비공개 자료를 새로 요청하지 마세요.\n4. '빠진 정보 / 이유 / 개선된 전체 프롬프트' 순서로 답하세요.\n5. 개선된 전체 프롬프트는 각 요소를 [목적], [역할], [맥락], [입력자료], [지시], [출력형식], [제약], [검증] 표식으로 구분해 주세요.\n\n[수강생 원본 프롬프트]\n${prompt}`}
const keyword=[['목적',15],['역할',5],['맥락',15],['입력자료',20],['지시',20],['출력형식',10],['제약',10],['검증',5]];
function canonicalHeading(word){const words={목적:'목적',목표:'목적',역할:'역할',맥락:'맥락',상황:'맥락',입력자료:'입력자료','입력 자료':'입력자료',참고자료:'입력자료','참고 자료':'입력자료',지시:'지시',작업:'지시',요청:'지시',출력형식:'출력형식','출력 형식':'출력형식','결과 형식':'출력형식',제약:'제약',조건:'제약',검증:'검증',검토:'검증'};return words[word?.replace(/\s+/g,' ').trim()]||null;}
function cleanedHeadingLine(raw){return raw.trim().replace(/^>\s*/,'').replace(/^#{1,6}\s*/,'').replace(/^\d{1,2}[.)]\s*/,'').replace(/^[-*•]\s+(?=[\[\w가-힣])/,'').replace(/\*\*|__/g,'').trim();}
function extractImprovedBody(txt){const text=String(txt||'').replace(/\r\n?/g,'\n');const lines=text.split('\n');let idx=-1;
 for(let i=0;i<lines.length;i++){let clean=cleanedHeadingLine(lines[i]);if(/^(?:개선된|수정된|보완한|최종)\s*(?:전체\s*)?프롬프트(?:\s*\([^)]*\))?\s*[:：]?$/.test(clean)){idx=i;break}}

function navigate(id){if(!renderers[id])return;data.active=id;if(part1ids.includes(id))data.expanded.first=true;else data.expanded.second=true;render();window.scrollTo({top:0,behavior:'instant'});closeMobile();}
function closeMobile(){document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('overlay').classList.remove('visible');document.getElementById('mobileMenu').setAttribute('aria-expanded','false')}
function exampleBuilder(){const hasAny=Object.values(data.builder).some(v=>String(v||'').trim());if(hasAny&&!confirm('현재 작성 중인 8개 요소를 선택 예제의 예시로 교체할까요?'))return;Object.assign(data.builder,builderExamples[data.docConfirmed?data.selectedDoc:'plan']);data.promptOriginal=makePrompt(data.builder);data.improveRequest=buildImprovementRequest(data.promptOriginal);data.comparison=false;data.finalConfirmed=false;render();toast('선택한 예제의 작성 예시를 입력함')}
function selectDoc(key){if(!demo[key])return;const switched=data.docConfirmed&&data.selectedDoc!==key;if(switched&&(Object.values(data.builder).some(x=>String(x||'').trim())||data.promptImproved||data.finalPrompt||data.aiRaw||data.humanRevised)&&!confirm('다른 예제를 선택하면 이전 예제의 프롬프트, AI 초안, 수정 문서가 초기화됩니다. 변경할까요?'))return;if(switched){data.builder=defaults().builder;data.promptOriginal='';data.improveRequest='';data.promptImproved='';data.finalPrompt='';data.finalChecklist=[false,false,false,false];data.finalConfirmed=false;data.finalLinkedDoc=null;data.comparison=false;data.aiRaw='';data.humanRevised='';data.checks=defaults().checks;}data.selectedDoc=key;data.docConfirmed=true;data.builderSourceDoc=key;render();toast(demo[key].title+' 예제를 선택함')}
function importFinal(from){const newText=from==='improved'?extractImprovedBody(data.promptImproved):from==='original'?(data.promptOriginal||makePrompt(data.builder)):'';if(from!=='clear'&&!newText.trim()){toast('가져올 문장이 없습니다');return}if(String(data.finalPrompt||'').trim()&&data.finalPrompt.trim()!==newText.trim()&&!confirm('현재 최종 편집 문장을 새 내용으로 바꿀까요?'))return;data.finalPrompt=newText;data.finalConfirmed=false;data.finalLinkedDoc=null;data.finalChecklist=[false,false,false,false];render();document.getElementById('finalPrompt')?.focus();toast(from==='clear'?'새로 작성할 수 있습니다.':'최종 편집창에 가져왔음. 검토 후 확정하세요.')}
function confirmFinal(){if(!data.docConfirmed){toast('먼저 실습 ① 예제를 선택해 주세요');navigate('practice1');return}if(!String(data.finalPrompt||'').trim()){toast('최종 프롬프트를 입력해 주세요');return}if(!data.finalChecklist.every(Boolean)){toast('실습 연결 전 사람 점검 4가지를 확인해 주세요');return}data.finalConfirmed=true;data.finalLinkedDoc=data.selectedDoc;persist();render();toast('최종 프롬프트를 '+demo[data.selectedDoc].title+' 예제에 확정함')}

function doCompare(){if(!data.promptImproved.trim()){toast('먼저 ChatGPT 개선본을 붙여넣으세요');return}data.comparison=true;render();toast('구조 표시를 비교함 — 내용 품질 평가는 별도입니다')}
function doBackup(){const payload={schemaVersion:1,exportedAt:new Date().toISOString(),title:'261111 사회복지 AI 수업 HTML 시안',data};download('261111_사회복지AI_실습기록.json',JSON.stringify(payload,null,2),'application/json');toast('활동 기록 JSON 파일 저장')}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.builder){data.builder[t.dataset.builder]=t.value;data.promptOriginal='';data.improveRequest='';data.comparison=false;data.finalConfirmed=false;persist()}else if(t.dataset.bind){data[t.dataset.bind]=t.value;if(t.dataset.bind==='finalPrompt'){data.finalConfirmed=false;data.finalLinkedDoc=null;}if(t.dataset.bind==='promptImproved'){data.comparison=false;}persist()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.check!==undefined){data.checks[Number(t.dataset.check)]=t.checked;persist()}if(t.dataset.setupcheck!==undefined){data.setupChecks[Number(t.dataset.setupcheck)]=t.checked;persist()}if(t.dataset.postercheck!==undefined){data.posterChecks[Number(t.dataset.postercheck)]=t.checked;persist()}if(t.dataset.finalcheck!==undefined){data.finalChecklist[Number(t.dataset.finalcheck)]=t.checked;data.finalConfirmed=false;persist()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const id=el.id, navId=el.dataset.nav,toggle=el.dataset.toggle;
 if(el.dataset.openSource!==undefined){openSourceReference();return}
 if(navId){navigate(navId);return}if(toggle){data.expanded[toggle]=!data.expanded[toggle];nav();persist();return}
 if(el.dataset.lectureIndex!==undefined){data.theorySlide=Math.max(0,Math.min(lectureSlides.length-1,Number(el.dataset.lectureIndex)||0));render();return}
 if(id==='prevSlide'||id==='nextSlide'){moveTheorySlide(id==='nextSlide'?1:-1);return}
 if(id==='goTheoryQuiz'){navigate('quiz');return}
 if(el.dataset.doc){selectDoc(el.dataset.doc);return}
 switch(id){case 'mobileMenu':{const o=document.getElementById('sidebar');const open=!o.classList.contains('mobile-open');o.classList.toggle('mobile-open',open);document.getElementById('overlay').classList.toggle('visible',open);el.setAttribute('aria-expanded',String(open));break}
 case 'prevPage':case 'nextPage':{const idx=ids.indexOf(data.active)+(id==='nextPage'?1:-1);navigate(ids[Math.max(0,Math.min(ids.length-1,idx))]);break}
 case 'generateBuilder':{data.promptOriginal=makePrompt(data.builder);if(!data.promptOriginal){toast('프롬프트 요소를 먼저 작성해 주세요');break}data.improveRequest=buildImprovementRequest(data.promptOriginal);data.comparison=false;render();toast('원본 프롬프트 블록 생성');break}
 case 'builderFillDemo':exampleBuilder();break;case 'copyOriginal':copyText(data.promptOriginal||makePrompt(data.builder));break;
 case 'copyImprove':{const prompt=data.promptOriginal||makePrompt(data.builder);copyText(buildImprovementRequest(prompt));break}
 case 'comparePrompts':doCompare();break;case 'importImproved':importFinal('improved');break;case 'importOriginal':importFinal('original');break;case 'clearFinal':importFinal('clear');break;case 'confirmFinal':confirmFinal();break;case 'moveFinal':{if(!readyFinalPrompt()){toast('최종 프롬프트를 점검하고 확정해 주세요');break}navigate('practice2');toast('확정한 프롬프트와 원자료가 연결됨');break}
 case 'copyFinal':copyText(data.finalPrompt);break;case 'copySource':copyText(demo[data.selectedDoc].source);break;
 case 'goBuilder':navigate('builder');break;case 'backChooseDoc':navigate('practice1');break;case 'goP2':navigate('practice2');break;case 'copyPracticePrompt':copyText(combinedPracticePrompt());break;case 'copyOnlyPracticePrompt':copyText(data.docConfirmed?practicePrompt():'');break;
 case 'useDefaultPrompt':{copyText(getDefaultRequest());toast('기본 프롬프트 복사함 (작성한 최종본 유지)');break}
 case 'openChatGPT':window.open('https://chatgpt.com/','_blank','noopener,noreferrer');break;case 'goP3':navigate('practice3');break;
 case 'downloadDoc':{if(!String(data.humanRevised||'').trim()){toast('수정 문서를 입력한 후 저장해 주세요');break}download('261111_수정문서_교육용.txt','[교육용 가상자료]\n'+data.humanRevised);toast('수정 문서 TXT 저장');break}
 case 'downloadPrompt':{const txt=combinedPracticePrompt()||data.finalPrompt||data.promptOriginal||getDefaultRequest();download('261111_프롬프트_교육용.txt',txt);toast('프롬프트와 가상자료 TXT 저장');break}
 case 'copyPosterRules':copyText(posterRulesText());break;case 'copyPosterSource':copyText(posterSourceText());break;case 'downloadPosterLogo':downloadPosterLogo();break;case 'goProjectSetup':navigate('projectSetup');break;case 'goPoster':navigate('poster');break;case 'copyPoster':copyText(combinedPosterPrompt());break;case 'goPosterReview':navigate('posterReview');break;
 case 'downloadPosterReview':download('261111_포스터_검증메모.txt','[교육용 가상자료]\n'+data.posterMemo+'\n\n확인 상태: '+data.posterChecks.filter(Boolean).length+'/5');toast('메모 저장');break;
 case 'downloadBackup':case 'backupHere':case 'backupPoster':doBackup();break;
 case 'restoreBackup':document.getElementById('restoreFile').click();break;
 case 'backBuilder':navigate('builder');break;
 case 'resetAll':if(confirm('이 브라우저의 모든 실습 입력과 선택 결과를 지울까요? JSON 백업 후 초기화를 권장합니다.')){data=defaults();render();toast('입력을 초기화함')}break;
 }
});
document.addEventListener('keydown',e=>{
 if(data.active!=='theory'||e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();moveTheorySlide(e.key==='ArrowRight'?1:-1)}
});
const sourceDialog=document.getElementById('sourceReferenceDialog');
sourceDialog.addEventListener('click',e=>{if(e.target===sourceDialog)sourceDialog.close();});
document.getElementById('closeSourceReference').addEventListener('click',()=>sourceDialog.close());
document.getElementById('closeSourceReferenceBottom').addEventListener('click',()=>sourceDialog.close());
document.getElementById('copySourceReference').addEventListener('click',()=>{if(data.docConfirmed&&demo[data.selectedDoc])copyText(demo[data.selectedDoc].source)});
document.getElementById('overlay').addEventListener('click',closeMobile);
document.getElementById('restoreFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2_000_000)throw Error('JSON 파일 용량이 너무 큼');const obj=JSON.parse(await file.text());if(obj.schemaVersion!==1||!obj.data||typeof obj.data!=='object'||!obj.data.builder||!obj.data.selectedDoc)throw Error('이 실습안의 백업 파일이 아님');const d=defaults();data={...d,...obj.data,builder:{...d.builder,...obj.data.builder},expanded:{...d.expanded,...obj.data.expanded},checks:Array.isArray(obj.data.checks)?obj.data.checks.slice(0,5):d.checks,finalChecklist:Array.isArray(obj.data.finalChecklist)?obj.data.finalChecklist.slice(0,4):d.finalChecklist};if(!renderers[data.active])data.active='builder';if(!demo[data.selectedDoc])data.selectedDoc='plan';render();toast('활동 기록을 복원함')}catch(err){toast('복원 실패: '+err.message)}e.target.value=''});
render();
</script>
</body>
</html>
